name: Build & test

on:
  push:
    branches: [master, aarch64]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            name: Linux aarch64
          - os: macos-15
            name: macOS aarch64
          - os: windows-2022
            name: Windows x86_64

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          preset: ci
          cache-key-os: ${{ matrix.os }}

      # No restore-keys: a partial hit would be an AOT cache built from
      # different sources, and the touch below would then hide the staleness
      # from Ninja. Only an exact hit is safe to reuse.
      - name: Restore AOT cache
        id: cache-aot
        uses: actions/cache/restore@v5
        with:
          path: libs/aot-cache
          key: ${{ matrix.os }}-aot-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('libs/base/**/*.xtm', 'libs/core/**/*.xtm', 'libs/external/**/*.xtm', 'runtime/**/*.xtm', 'runtime/**/*.ll', 'src/**', 'include/**', 'CMakeLists.txt', 'extras/cmake/**') }}

      - name: Build extempore
        run: cmake --build build --target extempore

      # Checkout stamps the AOT inputs (and the build stamps the binary) newer
      # than the restored outputs, so without this Ninja re-runs the whole AOT
      # compile and the cache buys nothing. Safe only on an exact key hit.
      - name: Refresh AOT cache timestamps
        if: steps.cache-aot.outputs.cache-hit == 'true'
        shell: bash
        run: find libs/aot-cache -type f -exec touch {} +

      # Parallelism is Ninja's default; the AOT compile is throttled by the
      # `aot` job pool declared in CMakeLists.txt, which keeps the memory-hungry
      # extempore+LLVM-JIT processes to two at a time on every runner.
      - name: Build
        run: cmake --build build

      - name: Save AOT cache
        if: steps.cache-aot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: libs/aot-cache
          key: ${{ matrix.os }}-aot-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('libs/base/**/*.xtm', 'libs/core/**/*.xtm', 'libs/external/**/*.xtm', 'runtime/**/*.xtm', 'runtime/**/*.ll', 'src/**', 'include/**', 'CMakeLists.txt', 'extras/cmake/**') }}

      - name: Test
        timeout-minutes: 30
        # NOTE: the 'docs' label (docs/verify-examples.py) is intentionally not
        # run in CI --- it's a local-only tool (run it on Linux with
        # `ctest --test-dir build -L docs`). See docs/verify-examples.py header.
        run: ctest --test-dir build --build-config Release --parallel 4 --label-regex "libs-core|libs-external|compiler-unit|cpp-unit|examples-core|examples-audio|audio-offline" --output-on-failure
