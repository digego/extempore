name: Build & test

on:
  push:
    branches: [master, aarch64]
    paths-ignore:
      - ".claude/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - ".claude/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            name: Linux aarch64
          # The two newest macOS images, by name: the LLVM cache key comes
          # from the label, and macos-latest moves to a new compiler under it.
          - os: macos-15
            name: macOS 15 aarch64
          - os: macos-26
            name: macOS 26 aarch64
          - os: windows-2025
            name: Windows x86_64

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          preset: ci
          cache-key-os: ${{ matrix.os }}

      # No restore-keys: a partial hit would be an AOT cache built from
      # different sources, and the touch below would then hide the staleness
      # from Ninja. Only an exact hit is safe to reuse.
      - name: Restore AOT cache
        id: cache-aot
        uses: actions/cache/restore@v6
        with:
          path: build/libs/aot-cache
          key: ${{ matrix.os }}-aot-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('libs/base/**/*.xtm', 'libs/core/**/*.xtm', 'libs/external/**/*.xtm', 'libs/studio/*.xtm', 'runtime/**/*.xtm', 'runtime/**/*.ll', 'src/**', 'include/**', 'CMakeLists.txt', 'extras/cmake/**') }}

      - name: Build extempore
        run: cmake --build build --target extempore

      # Checkout stamps the AOT inputs (and the build stamps the binary) newer
      # than the restored outputs, so without this Ninja re-runs the whole AOT
      # compile and the cache buys nothing. Safe only on an exact key hit.
      - name: Refresh AOT cache timestamps
        if: steps.cache-aot.outputs.cache-hit == 'true'
        shell: bash
        run: find build/libs/aot-cache -type f -exec touch {} +

      # Parallelism is Ninja's default; the AOT compile is throttled by the
      # `aot` job pool declared in CMakeLists.txt, which keeps the memory-hungry
      # extempore+LLVM-JIT processes to two at a time on every runner.
      - name: Build
        run: cmake --build build

      - name: Save AOT cache
        if: steps.cache-aot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/libs/aot-cache
          key: ${{ matrix.os }}-aot-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('libs/base/**/*.xtm', 'libs/core/**/*.xtm', 'libs/external/**/*.xtm', 'libs/studio/*.xtm', 'runtime/**/*.xtm', 'runtime/**/*.ll', 'src/**', 'include/**', 'CMakeLists.txt', 'extras/cmake/**') }}

      - name: Test
        timeout-minutes: 30
        run: ctest --preset ci

  # .clang-tidy sets WarningsAsErrors, so a finding fails the job.
  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          preset: ci
          cache-key-os: ubuntu-24.04
          save-llvm-cache: "false"

      # The PyPI wheel, pinned in mise.toml to LLVM's major version.
      - name: Install clang-tidy
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: uv pipx:clang-tidy

      # clang-tidy needs the generated headers (e.g. ExtemporeVersion.h) and a
      # populated compile_commands.json to parse the translation units.
      - name: Generate sources and headers
        run: cmake --build build --target extempore

      - name: Run clang-tidy
        run: cmake --build build --target tidy
