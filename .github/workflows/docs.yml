name: Deploy docs

on:
  # Auto-deploy disabled until DOCS_DEPLOY_KEY is configured in repo secrets.
  # Re-enable by uncommenting the push trigger below.
  # push:
  #   branches: [master]
  #   paths: ['docs/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # node_modules/.astro holds the image service's transform cache; without
      # it CI re-encodes every optimised image from scratch on each run.
      - uses: actions/cache@v6
        with:
          path: docs/node_modules/.astro
          key: astro-${{ github.sha }}
          restore-keys: astro-
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm run build
        working-directory: docs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: extemporelang/extemporelang.github.io
          publish_dir: docs/dist
