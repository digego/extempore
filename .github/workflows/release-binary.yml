name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # Push events to matching vX.X.X*, e.g. v0.9.8-beta

permissions:
  contents: read

jobs:
  # One job creates the release, so the build jobs only upload to it. Its notes
  # are the tag's CHANGELOG.md section, which release.sh checks exists.
  create-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          awk -v h="## $TAG" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x86_64
            artifact: extempore-linux-x86_64
          - os: ubuntu-24.04-arm
            name: Linux aarch64
            artifact: extempore-linux-aarch64
          - os: macos-15
            name: macOS aarch64
            artifact: extempore-macos-aarch64
          - os: windows-2025
            name: Windows x86_64
            artifact: extempore-windows-x86_64

    steps:
      - uses: actions/checkout@v7

      # The `release` preset sets EXT_SHARE_DIR=. so the released binary
      # locates runtime/, libs/, etc. relative to CWD instead of the (long-gone)
      # CI worker's source path.
      - uses: ./.github/actions/setup-build
        with:
          preset: release
          cache-key-os: ${{ matrix.os }}
          extra-cmake-args: -DEXTEMPORE_VERSION=${{ github.ref_name }}

      # Parallelism is Ninja's default; the AOT compile is throttled by the
      # `aot` job pool declared in CMakeLists.txt.
      - name: Build
        run: cmake --build build

      # CPack zips what `cmake --install` lays out, under a top-level directory
      # named after the archive. It's run from beside cmake because the Windows
      # images also put Chocolatey's unrelated `cpack` on PATH.
      - name: Package
        shell: bash
        env:
          PACKAGE: ${{ matrix.artifact }}-${{ github.ref_name }}
        run: |
          "$(dirname "$(command -v cmake)")/cpack" --config build/CPackConfig.cmake \
            -B dist -D CPACK_PACKAGE_FILE_NAME="$PACKAGE"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber
