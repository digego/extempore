name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # Push events to matching vX.X.X*, e.g. v0.9.8-beta
  # A dry run: build and package every platform, and attach the archives to the
  # run instead of publishing a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job creates the release, so the build jobs only upload to it. Its notes
  # are the tag's CHANGELOG.md section, which release.sh checks exists. It's a
  # draft until the publish job has uploaded SHA256SUMS: the installers and the
  # VS Code extension download releases/latest, which skips drafts.
  create-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          awk -v h="## $TAG" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    # create-release is skipped on a dry run, which would otherwise skip this too
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x86_64
            artifact: extempore-linux-x86_64
          - os: ubuntu-24.04-arm
            name: Linux aarch64
            artifact: extempore-linux-aarch64
          - os: macos-15
            name: macOS aarch64
            artifact: extempore-macos-aarch64
          - os: windows-2025
            name: Windows x86_64
            artifact: extempore-windows-x86_64

    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dry-run-{0}', github.sha) }}

    steps:
      - uses: actions/checkout@v7

      # The released binary finds its files from its own path (../share,
      # ../lib). The `release` preset's EXT_SHARE_DIR=. makes its fallback, for
      # a binary moved out of its tree, the working directory rather than the
      # CI worker's long-gone source path.
      - uses: ./.github/actions/setup-build
        with:
          preset: release
          cache-key-os: ${{ matrix.os }}
          extra-cmake-args: -DEXTEMPORE_VERSION=${{ env.VERSION }}

      # Parallelism is Ninja's default; the AOT compile is throttled by the
      # `aot` job pool declared in CMakeLists.txt.
      - name: Build
        run: cmake --build build

      # CPack zips what `cmake --install` lays out, under a top-level directory
      # named after the archive. It's run from beside cmake because the Windows
      # images also put Chocolatey's unrelated `cpack` on PATH.
      - name: Package
        shell: bash
        env:
          PACKAGE: ${{ matrix.artifact }}-${{ env.VERSION }}
        run: |
          "$(dirname "$(command -v cmake)")/cpack" --config build/CPackConfig.cmake \
            -B dist -D CPACK_PACKAGE_FILE_NAME="$PACKAGE"

      # Install the archive with the installer script, from a local server, as
      # a user would (extras/release/smoke-test.*). On Windows this also runs
      # it in a clean container, without the Visual C++ runtime.
      - name: Smoke test
        shell: bash
        run: |
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum *.zip; else shasum -a 256 *.zip; fi > SHA256SUMS)
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -File extras/release/smoke-test.ps1 dist
          else
            extras/release/smoke-test.sh dist
          fi
          rm dist/SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/*.zip

      - name: Upload to release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber

      - name: Attach to the run (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          retention-days: 7
          compression-level: 0

  # SHA256SUMS lists every archive. The installers read it to find the archive
  # for their platform (its name is the one file name a release always has),
  # so it goes up last, and then the release is published.
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the archives (release)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.zip' -D dist

      - name: Download the archives (dry run)
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS and publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/SHA256SUMS --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false

      - name: Attach SHA256SUMS to the run (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 7
