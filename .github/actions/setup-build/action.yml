name: Set up Extempore build
description: >-
  Resolve the pinned LLVM version, restore (or build and save) the LLVM cache,
  install the platform build dependencies and configure the CMake build.

inputs:
  preset:
    description: CMake configure preset to use (see CMakePresets.json).
    required: true
  cache-key-os:
    description: >-
      Runner label used in the LLVM cache key. It has to distinguish
      architectures (ubuntu-24.04 vs ubuntu-24.04-arm), so pass matrix.os
      rather than runner.os.
    required: true
  extra-cmake-args:
    description: Extra arguments appended to the configure command.
    required: false
    default: ""
  save-llvm-cache:
    description: Save the LLVM build to the cache when this run had to compile any of it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The pinned version lives in CMakeLists.txt; deriving it here keeps the
    # cache key from going stale (and silently useless) after a version bump.
    - name: Resolve pinned LLVM version
      shell: bash
      run: |
        echo "LLVM_VERSION=$(sed -n 's/^set(DEP_LLVM_VERSION "\(.*\)")/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

    # The source tarball is ~140 MB and configure downloads it again anyway, so
    # keep it out of the cache. The cached objects stay valid because the
    # sources are extracted with the archive's timestamps (CMakeLists.txt).
    #
    # The key is a prefix: saves append the run id (below), and the restore
    # takes the newest match.
    - name: Restore LLVM cache
      uses: actions/cache/restore@v6
      with:
        path: |
          build/_deps
          !build/_deps/**/llvm-project-*.src.tar.xz
          build/.ninja_log
          build/.ninja_deps
        key: ${{ inputs.cache-key-os }}-llvm-${{ env.LLVM_VERSION }}-v8-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ inputs.cache-key-os }}-llvm-${{ env.LLVM_VERSION }}-v8

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev xorg-dev libglu1-mesa-dev

    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    # Configure downloads the LLVM, PCRE2 and googletest archives, and GitHub
    # serves those with an occasional 504. A failed download leaves no stamp,
    # so re-running configure retries it.
    - name: Configure
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if cmake --preset ${{ inputs.preset }} ${{ inputs.extra-cmake-args }}; then
            exit 0
          fi
          echo "configure attempt $attempt failed; retrying in 30s"
          sleep 30
        done
        exit 1

    # Always run: with a current cache this is a no-op. A restored cache can go
    # stale (a compiler-flag change, a runner image update), and Ninja then
    # recompiles LLVM here; `rebuilt` records that so the fresh build is saved
    # and the next run restores it, instead of every run paying for the rebuild.
    - name: Build LLVM
      id: build-llvm
      shell: bash
      run: |
        cmake --build build --target llvm-libs 2>&1 | tee llvm-build.log
        # Every run recompiles the two files that include VCSRevision.h, which
        # a fresh configure regenerates; only a real rebuild is worth a save.
        compiled=$(grep -cE 'Building (C|CXX) object _deps.llvm-build' llvm-build.log || true)
        if [ "$compiled" -gt 20 ]; then
          echo "rebuilt=true" >> "$GITHUB_OUTPUT"
        fi
        rm llvm-build.log

    - name: Save LLVM cache
      if: inputs.save-llvm-cache == 'true' && steps.build-llvm.outputs.rebuilt == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          build/_deps
          !build/_deps/**/llvm-project-*.src.tar.xz
          build/.ninja_log
          build/.ninja_deps
        key: ${{ inputs.cache-key-os }}-llvm-${{ env.LLVM_VERSION }}-v8-${{ github.run_id }}-${{ github.run_attempt }}
